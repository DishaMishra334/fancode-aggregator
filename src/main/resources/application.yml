server:
  port: 8080

spring:
  application:
    name: fancode-aggregator
  datasource:
    url: jdbc:h2:file:./data/fancodedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  primary-provider: provider-a
  canonical-match-id: match-1001
  match-mappings:
    a-match-1001: match-1001
    b-match-1001: match-1001
  poller:
    enabled: false # Enabled manually or when started in production
    interval-ms: 5000
    provider-b-base-url: http://localhost:8080
    match-id: b-match-1001

logging:
  level:
    com.fancode.aggregator: INFO
    org.springframework.web: WARN
